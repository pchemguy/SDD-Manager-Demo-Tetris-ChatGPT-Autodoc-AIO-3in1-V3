name: Verify browser application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium-headless-shell firefox
      - run: npm run check
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run package
      - run: npm run verify:package
      - run: npm run test:e2e
        env:
          TETRIS_PACKAGED_TEST: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: browser-candidate
          path: dist/release/*
